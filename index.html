<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الثعبان - Nokia Snake</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 360px;
            margin-bottom: 5px;
            padding: 0 5px;
        }
        #sound-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            border: 4px solid #43a047;
            border-radius: 6px;
            background-color: #c8d6af; /* لون شاشة نوكيا الكلاسيكي القديم */
            box-shadow: 0 5px 15px rgba(67, 160, 71, 0.3);
        }
        canvas {
            display: block;
            width: 100vw;
            max-width: 350px;
            height: auto;
        }
        /* تصميم أزرار التحكم الاتجاهية مثل الهواتف القديمة */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 260px;
            margin-top: 15px;
        }
        .btn {
            background-color: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            font-size: 22px;
            padding: 15px 0;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #43a047;
            transform: scale(0.95);
        }
        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; }
        .btn-right { grid-column: 3; }
        .btn-down { grid-column: 2; }
    </style>
</head>
<body>

    <div id="game-header">
        <span style="font-size: 14px; color: #43a047; font-weight: bold;">NOKIA SNAKE</span>
        <button id="sound-btn">🔊 الصوت مفعل</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="350" height="350"></canvas>
    </div>

    <!-- أزرار الاتجاهات للتحكم باللعبة -->
    <div class="controls">
        <button class="btn btn-up" id="upBtn">▲</button>
        <button class="btn btn-left" id="leftBtn">◀</button>
        <button class="btn btn-right" id="rightBtn">▶</button>
        <button class="btn btn-down" id="downBtn">▼</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const tileSize = 17.5; // حجم المربع الواحد في الشبكة (20x20 شبكة)
        const tileCount = 20;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = 0;
        let gameOver = false;
        let gameInterval = null;
        let soundEnabled = true;

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'eat') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.setValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.setValueAtTime(150, now + 0.2);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        const soundBtn = document.getElementById("sound-btn");
        soundBtn.addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? "🔊 الصوت مفعل" : "🔇 كتم الصوت";
            soundBtn.style.backgroundColor = soundEnabled ? "#27ae60" : "#e74c3c";
        });

        // التحكم عبر لوحة المفاتيح
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
            if (e.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
            if (e.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
            if (gameOver && e.key === "Enter") { resetGame(); }
        });

        // التحكم عبر الأزرار على الشاشة
        function setDirection(newDx, newDy) {
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;
            dx = newDx;
            dy = newDy;
        }

        document.getElementById("upBtn").addEventListener("click", () => setDirection(0, -1));
        document.getElementById("downBtn").addEventListener("click", () => setDirection(0, 1));
        document.getElementById("leftBtn").addEventListener("click", () => setDirection(-1, 0));
        document.getElementById("rightBtn").addEventListener("click", () => setDirection(1, 0));

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // التأكد من عدم ظهور الطعام فوق الثعبان
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            gameOver = false;
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            if (gameOver) return;

            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // الاصطدام بالحوائط (انهاء اللعبة في النمط الكلاسيكي)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver = true;
                playSound('gameover');
                clearInterval(gameInterval);
                return;
            }

            // الاصطدام بالجسد
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    playSound('gameover');
                    clearInterval(gameInterval);
                    return;
                }
            }

            snake.unshift(head);

            // أكل الطعام
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                if (score > highScore) highScore = score;
                playSound('eat');
                generateFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // مسح الشاشة بلون نوكيا الكلاسيكي
            ctx.fillStyle = "#c8d6af";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم شبكة خفيفة كلاسيكية
            ctx.strokeStyle = "#b5c49b";
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }

            // رسم الثعبان بلون داكن كلاسيكي
            ctx.fillStyle = "#1b2612";
            snake.forEach((part, index) => {
                ctx.fillRect(part.x * tileSize + 1, part.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });

            // رسم الطعام
            ctx.fillStyle = "#273b18";
            ctx.fillRect(food.x * tileSize + 2, food.y * tileSize + 2, tileSize - 4, tileSize - 4);

            // كتابة النقاط
            ctx.fillStyle = "#1b2612";
            ctx.font = "bold 13px Tahoma";
            ctx.textAlign = "left";
            ctx.fillText(`SCORE: ${score}`, 10, 22);

            if (gameOver) {
                ctx.fillStyle = "rgba(27, 38, 18, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "14px Tahoma";
                ctx.fillText("انقر لإعادة اللعب", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        canvas.addEventListener("click", () => {
            if (gameOver) resetGame();
        });

        generateFood();
        gameInterval = setInterval(gameLoop, 120);
    </script>
</body>
</html>
