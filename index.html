<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سباق السيارات - Retro Car Racing</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #f1c40f;
            margin-bottom: 5px;
            font-size: 22px;
        }
        p {
            color: #bdc3c7;
            font-size: 14px;
            margin-top: 0;
        }
        #game-container {
            display: inline-block;
            position: relative;
            border: 4px solid #34495e;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <h1>🚗 لعبة سباق السيارات (ICE vs FIRE)</h1>
    <p>استخدم أزرار الأسهم الأربعة (يمين، يسار، لفوق، لتحت) لتحريك سيارتك بحرية وتجنب السيارات!</p>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // إعدادات سيارتك (الازرق - Ice) مع حرية الحركة بالاتجاهات الأربعة
        let player = {
            x: 180,
            y: 480,
            width: 42,
            height: 75,
            speed: 5,
            color: "#00e5ff"
        };

        let enemies = [];
        let score = 0;
        let gameOver = false;
        let keys = {};

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (gameOver && e.key === "Enter") {
                resetGame();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function spawnEnemy() {
            if (Math.random() < 0.02) {
                let lanes = [50, 140, 230, 310];
                let randomLane = lanes[Math.floor(Math.random() * lanes.length)];
                enemies.push({
                    x: randomLane,
                    y: -90,
                    width: 42,
                    height: 75,
                    speed: 3 + Math.random() * 3,
                    color: "#ff3300" 
                });
            }
        }

        function resetGame() {
            enemies = [];
            score = 0;
            player.x = 180;
            player.y = 480;
            gameOver = false;
            loop();
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameOver) return;

            // حركة اللاعب في الاتجاهات الأربعة (يمين، يسار، لأعلى، لأسفل) مع الحفاظ على حدود الشاشة
            if ((keys["ArrowLeft"] || keys["A"] || keys["a"]) && player.x > 20) {
                player.x -= player.speed;
            }
            if ((keys["ArrowRight"] || keys["D"] || keys["d"]) && player.x < canvas.width - player.width - 20) {
                player.x += player.speed;
            }
            if ((keys["ArrowUp"] || keys["W"] || keys["w"]) && player.y > 20) {
                player.y -= player.speed;
            }
            if ((keys["ArrowDown"] || keys["S"] || keys["s"]) && player.y < canvas.height - player.height - 20) {
                player.y += player.speed;
            }

            spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                if (checkCollision(player, enemies[i])) {
                    gameOver = true;
                }

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10;
                }
            }
        }

        // دالة رسم السيارات (إذا لم تكن لاعب، يتم قلب تفاصيل السيارة لتناسب الاتجاه المعاكس)
        function drawCar(x, y, width, height, mainColor, isPlayer) {
            // الإطارات
            ctx.fillStyle = "#111";
            ctx.fillRect(x - 5, y + 10, 6, 16);
            ctx.fillRect(x - 5, y + height - 26, 6, 16);
            ctx.fillRect(x + width - 1, y + 10, 6, 16);
            ctx.fillRect(x + width - 1, y + height - 26, 6, 16);

            // هيكل السيارة
            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 8);
            ctx.fill();

            // مقصورة القيادة
            ctx.fillStyle = "#222";
            ctx.fillRect(x + 6, y + 22, width - 12, 28);

            // الزجاج (يختلف مكانه حسب اتجاه السيارة المعاكس)
            ctx.fillStyle = isPlayer ? "#ffffff" : "#ffcc66";
            if (isPlayer) {
                ctx.fillRect(x + 8, y + 25, width - 16, 12); // زجاج سيارة اللاعب للأمام
            } else {
                ctx.fillRect(x + 8, y + 38, width - 16, 12); // زجاج سيارة العدو بالعكس (مواجهة لك)
            }

            // المصابيح الأمامية
            ctx.fillStyle = isPlayer ? "#ffff00" : "#ffffff";
            if (isPlayer) {
                ctx.fillRect(x + 4, y + 2, 8, 4);
                ctx.fillRect(x + width - 12, y + 2, 8, 4);
            } else {
                // مصابيح العدو تصبح بالأسفل لأنها مواجهة للأسفل
                ctx.fillRect(x + 4, y + height - 6, 8, 4);
                ctx.fillRect(x + width - 12, y + height - 6, 8, 4);
            }
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // خطوط الطريق
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // رسم سيارتك
            drawCar(player.x, player.y, player.width, player.height, player.color, true);

            // رسم سيارات العدو
            for (let enemy of enemies) {
                drawCar(enemy.x, enemy.y, enemy.width, enemy.height, enemy.color, false);
            }

            // النقاط
            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 20px Tahoma";
            ctx.textAlign = "center";
            ctx.fillText(`النقاط: ${score}`, canvas.width / 2, 35);

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 30px Tahoma";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Tahoma";
                ctx.fillText("اضغط على مفتاح Enter لإعادة المحاولة", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>

</body>
</html>
