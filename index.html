<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة سباق السيارات - ICE vs FIRE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 3px solid #34495e;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100vw;
            max-width: 380px;
            height: auto;
            max-height: 70vh;
        }
        /* تصميم أزرار التحكم باللمس أسفل الشاشة */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 380px;
            margin-top: 10px;
            padding: 0 5px;
        }
        .btn {
            background-color: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            font-size: 20px;
            padding: 12px 0;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #e74c3c;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <!-- لوحة الأزرار السفلية -->
    <div class="controls">
        <button class="btn" id="leftBtn">◀</button>
        <button class="btn" id="rightBtn">▶</button>
        <button class="btn" id="upBtn">▲</button>
        <button class="btn" id="downBtn">▼</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = {
            x: 180,
            y: 480,
            width: 42,
            height: 75,
            speed: 5,
            color: "#00e5ff"
        };

        let enemies = [];
        let score = 0;
        let gameOver = false;
        let keys = {};

        // التحكم بلوحة المفاتيح
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (gameOver && e.key === "Enter") {
                resetGame();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        // ربط أزرار اللمس للموبايل
        function handleTouch(id, keyName) {
            const btn = document.getElementById(id);
            if(!btn) return;
            
            const pressOn = (e) => {
                e.preventDefault();
                keys[keyName] = true;
            };
            const pressOff = (e) => {
                e.preventDefault();
                keys[keyName] = false;
            };

            btn.addEventListener("touchstart", pressOn, { passive: false });
            btn.addEventListener("touchend", pressOff, { passive: false });
            btn.addEventListener("mousedown", pressOn);
            btn.addEventListener("mouseup", pressOff);
        }

        handleTouch("leftBtn", "ArrowLeft");
        handleTouch("rightBtn", "ArrowRight");
        handleTouch("upBtn", "ArrowUp");
        handleTouch("downBtn", "ArrowDown");

        function spawnEnemy() {
            if (Math.random() < 0.02) {
                let lanes = [50, 140, 230, 310];
                let randomLane = lanes[Math.floor(Math.random() * lanes.length)];
                enemies.push({
                    x: randomLane,
                    y: -90,
                    width: 42,
                    height: 75,
                    speed: 3 + Math.random() * 3,
                    color: "#ff3300" 
                });
            }
        }

        function resetGame() {
            enemies = [];
            score = 0;
            player.x = 180;
            player.y = 480;
            gameOver = false;
            loop();
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameOver) return;

            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 20) {
                player.x -= player.speed;
            }
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.width - 20) {
                player.x += player.speed;
            }
            if ((keys["ArrowUp"] || keys["w"]) && player.y > 20) {
                player.y -= player.speed;
            }
            if ((keys["ArrowDown"] || keys["s"]) && player.y < canvas.height - player.height - 20) {
                player.y += player.speed;
            }

            spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                if (checkCollision(player, enemies[i])) {
                    gameOver = true;
                }

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10;
                }
            }
        }

        function drawCar(x, y, width, height, mainColor, isPlayer) {
            ctx.fillStyle = "#111";
            ctx.fillRect(x - 5, y + 10, 6, 16);
            ctx.fillRect(x - 5, y + height - 26, 6, 16);
            ctx.fillRect(x + width - 1, y + 10, 6, 16);
            ctx.fillRect(x + width - 1, y + height - 26, 6, 16);

            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 8);
            ctx.fill();

            ctx.fillStyle = "#222";
            ctx.fillRect(x + 6, y + 22, width - 12, 28);

            ctx.fillStyle = isPlayer ? "#ffffff" : "#ffcc66";
            if (isPlayer) {
                ctx.fillRect(x + 8, y + 25, width - 16, 12);
            } else {
                ctx.fillRect(x + 8, y + 38, width - 16, 12);
            }

            ctx.fillStyle = isPlayer ? "#ffff00" : "#ffffff";
            if (isPlayer) {
                ctx.fillRect(x + 4, y + 2, 8, 4);
                ctx.fillRect(x + width - 12, y + 2, 8, 4);
            } else {
                ctx.fillRect(x + 4, y + height - 6, 8, 4);
                ctx.fillRect(x + width - 12, y + height - 6, 8, 4);
            }
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            drawCar(player.x, player.y, player.width, player.height, player.color, true);

            for (let enemy of enemies) {
                drawCar(enemy.x, enemy.y, enemy.width, enemy.height, enemy.color, false);
            }

            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 20px Tahoma";
            ctx.textAlign = "center";
            ctx.fillText(`النقاط: ${score}`, canvas.width / 2, 35);

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 30px Tahoma";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "15px Tahoma";
                ctx.fillText("انقر على الشاشة لإعادة المحاولة", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        canvas.addEventListener("click", () => {
            if (gameOver) resetGame();
        });

        loop();
    </script>
</body>
</html>
