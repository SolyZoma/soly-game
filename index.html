<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Calculator - آلة حاسبة آبل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 380px;
            background-color: #000000;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100vh;
            max-height: 750px;
        }

        /* شاشة العرض */
        .display {
            text-align: right;
            padding: 10px 10px 20px 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 120px;
            direction: rtl;
        }

        .expression {
            font-size: 1.5rem;
            color: #a5a5a7;
            margin-bottom: 5px;
            min-height: 30px;
            font-weight: 400;
            direction: ltr;
            text-align: right;
        }

        .result {
            font-size: 4.2rem;
            color: #ffffff;
            font-weight: 300;
            line-height: 1;
            direction: ltr;
            text-align: right;
        }

        /* لوحة الأزرار */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            direction: ltr;
        }

        button {
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.15s ease;
            outline: none;
        }

        button:active {
            filter: brightness(130%);
        }

        /* ألوان الأزرار */
        .btn-dark-gray {
            background-color: #333333;
            color: #ffffff;
        }

        .btn-orange {
            background-color: #ff9f0a;
            color: #ffffff;
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <!-- الصف الأول: [x] | AC | % | ÷ -->
            <button class="btn-dark-gray" onclick="deleteLast()" style="font-size: 1.4rem;">⌫</button>
            <button class="btn-dark-gray" onclick="clearAll()">AC</button>
            <button class="btn-dark-gray" onclick="appendValue('%')">%</button>
            <button class="btn-orange" onclick="setOperator('/')">÷</button>

            <!-- الصف الثاني: 7 | 8 | 9 | × -->
            <button class="btn-dark-gray" onclick="appendNumber('7')">7</button>
            <button class="btn-dark-gray" onclick="appendNumber('8')">8</button>
            <button class="btn-dark-gray" onclick="appendNumber('9')">9</button>
            <button class="btn-orange" onclick="setOperator('*')">×</button>

            <!-- الصف الثالث: 4 | 5 | 6 | - -->
            <button class="btn-dark-gray" onclick="appendNumber('4')">4</button>
            <button class="btn-dark-gray" onclick="appendNumber('5')">5</button>
            <button class="btn-dark-gray" onclick="appendNumber('6')">6</button>
            <button class="btn-orange" onclick="setOperator('-')">−</button>

            <!-- الصف الرابع: 1 | 2 | 3 | + -->
            <button class="btn-dark-gray" onclick="appendNumber('1')">1</button>
            <button class="btn-dark-gray" onclick="appendNumber('2')">2</button>
            <button class="btn-dark-gray" onclick="appendNumber('3')">3</button>
            <button class="btn-orange" onclick="setOperator('+')">+</button>

            <!-- الصف الخامس: +/- | 0 | . | = -->
            <button class="btn-dark-gray" onclick="toggleSign()" style="font-size: 1.3rem;">+/–</button>
            <button class="btn-dark-gray" onclick="appendNumber('0')">0</button>
            <button class="btn-dark-gray" onclick="appendDecimal()">.</button>
            <button class="btn-orange" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const resultEl = document.getElementById('result');
        const expressionEl = document.getElementById('expression');

        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let resetScreen = false;

        function updateDisplay() {
            resultEl.textContent = currentInput;
            expressionEl.textContent = previousInput + (operator ? ' ' + getOperatorSymbol(operator) + ' ' : '');
        }

        function getOperatorSymbol(op) {
            if (op === '/') return '÷';
            if (op === '*') return '×';
            if (op === '-') return '−';
            if (op === '+') return '+';
            return op;
        }

        function appendNumber(num) {
            if (currentInput === '0' || resetScreen) {
                currentInput = num;
                resetScreen = false;
            } else {
                if (currentInput.length < 12) {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (resetScreen) {
                currentInput = '0.';
                resetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function setOperator(op) {
            if (operator !== null && !resetScreen) {
                calculate();
            }
            previousInput = currentInput;
            operator = op;
            resetScreen = true;
            updateDisplay();
        }

        function calculate() {
            if (operator === null || resetScreen) return;
            let computation;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operator) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    computation = current === 0 ? 'Error' : prev / current;
                    break;
                default:
                    return;
            }

            currentInput = String(computation);
            if (currentInput.length > 12) {
                currentInput = Number(computation).toPrecision(8);
            }
            expressionEl.textContent = previousInput + ' ' + getOperatorSymbol(operator) + ' ' + currentInput + ' =';
            operator = null;
            previousInput = '';
            resetScreen = true;
            resultEl.textContent = currentInput;
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            resetScreen = false;
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length === 1 || currentInput === 'Error') {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput !== '0') {
                if (currentInput.startsWith('-')) {
                    currentInput = currentInput.slice(1);
                } else {
                    currentInput = '-' + currentInput;
                }
                updateDisplay();
            }
        }

        function appendValue(type) {
            if (type === '%') {
                currentInput = String(parseFloat(currentInput) / 100);
                updateDisplay();
            }
        }
    </script>
</body>
</html>
