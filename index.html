<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة Ice Man - سباق وقفز</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 380px;
            margin-bottom: 5px;
            padding: 0 5px;
        }
        #sound-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            border: 3px solid #00e5ff;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,229,255,0.3);
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100vw;
            max-width: 380px;
            height: auto;
            max-height: 65vh;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 380px;
            margin-top: 12px;
            padding: 0 5px;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background-color: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            font-size: 26px;
            padding: 14px 0;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #00e5ff;
            color: #000;
            transform: scale(0.96);
        }
        #jumpBtn {
            background-color: #2980b9;
            border-color: #3498db;
        }
    </style>
</head>
<body>

    <div id="game-header">
        <span style="font-size: 14px; color: #00e5ff; font-weight: bold;">ICE MAN ADVENTURE</span>
        <button id="sound-btn">🔊 تشغيل الصوت</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="550"></canvas>
    </div>

    <div class="controls">
        <button class="btn" id="leftBtn">◀</button>
        <button class="btn" id="jumpBtn">▲ قفز</button>
        <button class="btn" id="rightBtn">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let audioCtx = null;
        let soundEnabled = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChiptuneSound(type) {
            if (!soundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'coin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'gameover') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(350, now + 0.15);
                osc.frequency.setValueAtTime(300, now + 0.3);
                osc.frequency.setValueAtTime(200, now + 0.45);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc.start(now);
                osc.stop(now + 0.7);
            }
        }

        const soundBtn = document.getElementById("sound-btn");
        soundBtn.addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundBtn.textContent = "🔊 الصوت مفعل";
                soundBtn.style.backgroundColor = "#27ae60";
                playChiptuneSound('coin');
            } else {
                soundBtn.textContent = "🔇 كتم الصوت";
                soundBtn.style.backgroundColor = "#e74c3c";
            }
        });

        let player = {
            x: 180,
            y: 430,
            width: 38,
            height: 55,
            speed: 5,
            velocityY: 0,
            jumpPower: -11,
            gravity: 0.55,
            grounded: true,
            color: "#00e5ff"
        };

        let obstacles = [];
        let score = 0;
        let gameOver = false;
        let keys = {};

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if ((e.key === " " || e.key === "ArrowUp" || e.key === "w") && player.grounded && !gameOver) {
                player.velocityY = player.jumpPower;
                player.grounded = false;
                playChiptuneSound('jump');
            }
            if (gameOver && e.key === "Enter") {
                resetGame();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function handleTouch(id, keyName, isJump = false) {
            const btn = document.getElementById(id);
            if(!btn) return;
            
            const pressOn = (e) => {
                e.preventDefault();
                if (isJump) {
                    if (player.grounded && !gameOver) {
                        player.velocityY = player.jumpPower;
                        player.grounded = false;
                        playChiptuneSound('jump');
                    }
                } else {
                    keys[keyName] = true;
                }
                if (!soundEnabled) {
                    soundEnabled = true;
                    soundBtn.textContent = "🔊 الصوت مفعل";
                    soundBtn.style.backgroundColor = "#27ae60";
                }
            };
            const pressOff = (e) => {
                e.preventDefault();
                if (!isJump) {
                    keys[keyName] = false;
                }
            };

            btn.addEventListener("touchstart", pressOn, { passive: false });
            btn.addEventListener("touchend", pressOff, { passive: false });
            btn.addEventListener("mousedown", pressOn);
            btn.addEventListener("mouseup", pressOff);
        }

        handleTouch("leftBtn", "ArrowLeft");
        handleTouch("rightBtn", "ArrowRight");
        handleTouch("jumpBtn", "Space", true);

        function spawnObstacle() {
            if (Math.random() < 0.02) {
                let isFire = Math.random() < 0.6;
                obstacles.push({
                    x: Math.random() * (canvas.width - 50),
                    y: -50,
                    width: 35,
                    height: 35,
                    speed: 2.5 + Math.random() * 2,
                    type: isFire ? 'fire' : 'spike'
                });
            }
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            player.x = 180;
            player.y = 430;
            player.velocityY = 0;
            player.grounded = true;
            gameOver = false;
            loop();
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameOver) return;

            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 10) {
                player.x -= player.speed;
            }
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.width - 10) {
                player.x += player.speed;
            }

            player.velocityY += player.gravity;
            player.y += player.velocityY;

            let floorY = 430;
            if (player.y >= floorY) {
                player.y = floorY;
                player.velocityY = 0;
                player.grounded = true;
            }

            spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                if (checkCollision(player, obstacles[i])) {
                    gameOver = true;
                    playChiptuneSound('gameover');
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    playChiptuneSound('coin');
                }
            }
        }

        function fnDrawIceMan(x, y, width, height) {
            ctx.fillStyle = "#00e5ff";
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 10);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x + 6, y + 10, width - 12, 12);
            ctx.fillStyle = "#002b36";
            ctx.fillRect(x + 10, y + 13, 5, 6);
            ctx.fillRect(x + width - 15, y + 13, 5, 6);
        };

        function drawObstacle(obs) {
            if (obs.type === 'fire') {
                ctx.fillStyle = "#ff3300";
                ctx.beginPath();
                ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = "#95a5a6";
                ctx.beginPath();
                ctx.moveTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.lineTo(obs.x, obs.y + obs.height);
                ctx.closePath();
                ctx.fill();
            }
        }

        function draw() {
            ctx.fillStyle = "#111827";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00e5ff";
            ctx.fillRect(0, 485, canvas.width, 10);

            fnDrawIceMan(player.x, player.y, player.width, player.height);

            for (let obs of obstacles) {
                drawObstacle(obs);
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px Tahoma";
            ctx.textAlign = "center";
            ctx.fillText(`النقاط: ${score}`, canvas.width / 2, 35);

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 30px Tahoma";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "15px Tahoma";
                ctx.fillText("انقر على الشاشة لإعادة المحاولة", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        canvas.addEventListener("click", () => {
            if (gameOver) resetGame();
        });

        loop();
    </script>
</body>
</html>
